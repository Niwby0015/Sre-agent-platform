/* SRE-Agent UI — light ops console tokens */

:root {
  /* Neutral foundation */
  --sre-background: #ffffff;
  --sre-foreground: #1f2937;
  --sre-card: #ffffff;
  --sre-card-foreground: #1f2937;
  --sre-popover: #ffffff;
  --sre-popover-foreground: #1f2937;
  --sre-muted: #f3f4f6;
  --sre-muted-foreground: #6b7280;
  --sre-border: #e5e7eb;
  --sre-input: #f9fafb;
  --sre-ring: #0891b2;

  /* Brand primary — cyan */
  --sre-primary: #0e7490;
  --sre-primary-foreground: #ffffff;
  --sre-primary-hover: #155e75;
  --sre-primary-subtle: rgba(14, 116, 144, 0.10);

  /* Semantic surfaces */
  --sre-surface: #ffffff;
  --sre-surface-2: #f3f4f6;
  --sre-surface-3: #e5e7eb;
  --sre-line: #e5e7eb;

  /* State colors */
  --sre-state-success: #16a34a;
  --sre-state-success-subtle: rgba(22, 163, 74, 0.12);
  --sre-state-warning: #d97706;
  --sre-state-warning-subtle: rgba(217, 119, 6, 0.12);
  --sre-state-error: #dc2626;
  --sre-state-error-subtle: rgba(220, 38, 38, 0.12);
  --sre-state-info: #2563eb;
  --sre-state-info-subtle: rgba(37, 99, 235, 0.12);

  /* Radius */
  --sre-radius-small: 4px;
  --sre-radius-medium: 8px;
  --sre-radius-large: 12px;

  /* Typography */
  --sre-font-sans: Inter, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --sre-font-mono: "JetBrains Mono", "Fira Code", "SF Mono", Consolas, monospace;
}

.light {
  color-scheme: light;
}

  .sre-bar-err { background: var(--sre-state-error); }
  .sre-grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-items: start; }
  .sre-conn-ok { background: var(--sre-state-success-subtle); color: var(--sre-state-success); }
  .sre-conn-warn { background: var(--sre-state-warning-subtle); color: var(--sre-state-warning); }
  .sre-conn-err { background: var(--sre-state-error-subtle); color: var(--sre-state-error); }
  @media (max-width: 900px) { .sre-grid-2 { grid-template-columns: 1fr; } }
</style>
<script>
(function () {
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const badgeHtml = (tone, text) => {
    const cls = tone === 'success' ? 'sre-badge-success' : tone === 'warning' ? 'sre-badge-warning' : tone === 'error' ? 'sre-badge-error' : 'sre-badge-info';
    return '<span class="sre-badge ' + cls + '">' + esc(text) + '</span>';
  };
  const SEV = {
    critical: ['严重', 'sre-badge-error', 'sre-status-fail'],
    warning: ['警告', 'sre-badge-warning', 'sre-status-warn'],
    info: ['信息', 'sre-badge-info', 'sre-status-pass'],
  };
  const fmtAgo = iso => {
    if (!iso) return '—';
    const t = new Date(iso).getTime();
    if (isNaN(t)) return iso;
    const s = Math.max(0, (Date.now() - t) / 1000);
    if (s < 60) return '刚刚';
    if (s < 3600) return Math.floor(s / 60) + ' 分钟前';
    if (s < 86400) return Math.floor(s / 3600) + ' 小时前';
    return Math.floor(s / 86400) + ' 天前';
  };
  const barClass = p => (p == null ? '' : p >= 90 ? 'sre-bar-err' : p >= 70 ? 'sre-bar-warn' : '');
  const bar = (pct, label) => {
    if (pct == null) return '';
    return '<div style="display:flex;align-items:center;gap:8px;min-width:0;flex:1">' +
      '<span class="sre-kv-meta" style="width:34px">' + label + '</span>' +
      '<div class="sre-bar-track"><div class="sre-bar ' + barClass(pct) + '" style="width:' + Math.min(100, pct) + '%"></div></div>' +
      '<span class="sre-kv-meta" style="width:48px;text-align:right">' + pct + '%</span>' +
      '</div>';
  };
  const panel = (title, badge, body) =>
    '<div class="sre-panel"><div class="sre-panel-head"><span class="sre-panel-title">' + esc(title) + '</span>' + (badge || '') + '</div>' +
    '<div class="sre-panel-body">' + body + '</div></div>';
  const empty = msg => '<div class="sre-empty">' + esc(msg) + '</div>';
  const groupLabel = text => '<div class="sre-kv-row" style="font-weight:600;color:var(--sre-muted-foreground);font-size:12px;text-transform:uppercase;letter-spacing:.04em">' + esc(text) + '</div>';

  function render(data) {
    const s = data.summary || {};

    // --- KPI cards ---
    const setKpi = (id, value, delta, color) => {
      const el = document.getElementById(id);
      if (!el) return;
      el.textContent = value;
      el.style.color = color || 'var(--sre-foreground)';
      const d = document.getElementById(id + '-delta');
      if (d) d.textContent = delta || '—';
    };
    const score = data.health_score;
    const scoreTone = score == null ? 'var(--sre-muted-foreground)' : score >= 80 ? 'var(--sre-state-success)' : score >= 60 ? 'var(--sre-state-warning)' : 'var(--sre-state-error)';
    setKpi('kpi-score', score == null ? '—' : String(score), score == null ? '未连接集群' : (score >= 80 ? '运行良好' : score >= 60 ? '需关注' : '存在风险'), scoreTone);
    setKpi('kpi-nodes', (s.nodes_total != null) ? (s.nodes_ready + '/' + s.nodes_total) : '—', s.nodes_total != null ? ((s.nodes_total - s.nodes_ready) + ' 未就绪') : '—', (s.nodes_ready != null && s.nodes_ready < s.nodes_total) ? 'var(--sre-state-warning)' : 'var(--sre-foreground)');
    setKpi('kpi-pods', (s.unhealthy_pods != null) ? String(s.unhealthy_pods) : '—', (s.pods_total != null) ? ('共 ' + s.pods_total + ' Pod') : '—', (s.unhealthy_pods > 0) ? 'var(--sre-state-error)' : 'var(--sre-foreground)');
    setKpi('kpi-findings', (s.open_findings != null) ? String(s.open_findings) : '—', ((s.critical_findings || 0) + ' 严重'), (s.critical_findings > 0) ? 'var(--sre-state-error)' : (s.open_findings > 0) ? 'var(--sre-state-warning)' : 'var(--sre-foreground)');

    // --- connection banner ---
    const banner = document.getElementById('sre-conn-banner');
    if (data.connected) {
      banner.className = 'sre-card sre-conn-ok';
      banner.innerHTML = '<i data-lucide="check-circle-2" style="width:16px;height:16px"></i><span style="margin-left:8px;font-weight:600">已连接集群</span><span style="margin-left:8px;opacity:.85">节点 ' + (s.nodes_total || 0) + ' · Pod ' + (s.pods_total || 0) + ' · 实时快照</span>';
    } else {
      const err = data.source === 'error';
      banner.className = 'sre-card ' + (err ? 'sre-conn-err' : 'sre-conn-warn');
      banner.innerHTML = '<i data-lucide="cloud-off" style="width:16px;height:16px"></i><span style="margin-left:8px;font-weight:600">' + (err ? '健康检查异常' : '未连接集群') + '</span><span style="margin-left:8px;opacity:.85">' + esc(data.cluster_error || '') + '</span>';
    }
    banner.style.cssText = 'margin-bottom:16px;padding:14px 20px;display:flex;align-items:center';

    // --- sections ---
    const parts = [];

    // 开放告警 (persisted findings)
    (function () {
      const items = data.findings || [];
      if (!items.length) { parts.push(panel('开放告警', badgeHtml('success', '0'), empty('当前无开放告警'))); return; }
      const rows = items.map(f => {
        const sev = SEV[f.severity] || SEV.info;
        const ns = f.namespace ? '<span class="sre-kv-meta">' + esc(f.namespace) + ' · </span>' : '';
        const repeat = (f.times_seen > 1) ? (' · 重复 ' + f.times_seen + ' 次') : '';
        const acked = f.acked ? ' <span class="sre-badge sre-badge-info">已确认</span>' : '';
        return '<div class="sre-kv-row">' +
          '<span class="sre-status-dot ' + sev[2] + '"></span>' +
          '<span class="sre-kv-name" style="flex:1">' + esc(f.title) + '</span>' +
          '<span class="sre-kv-meta">' + ns + '最后 ' + fmtAgo(f.last_seen) + repeat + '</span>' +
          '<span class="sre-badge ' + sev[1] + '">' + sev[0] + '</span>' + acked +
          '</div>';
      }).join('');
      parts.push(panel('开放告警', badgeHtml((s.critical_findings > 0) ? 'error' : 'warning', String(items.length)), rows));
    })();

    // 节点健康 (with utilisation bars) + 异常 Pod
    const nodesRows = (function () {
      const nodes = data.nodes || [];
      const metrics = {};
      (data.node_metrics || []).forEach(m => { metrics[m.name] = m; });
      if (!nodes.length) return '<div class="sre-empty">未获取到节点数据</div>';
      return nodes.map(n => {
        const m = metrics[n.name];
        const util = m
          ? '<div style="flex:1;display:flex;flex-direction:column;gap:6px;min-width:0">' + bar(m.cpu_percent, 'CPU') + bar(m.memory_percent, '内存') + '</div>'
          : '<span class="sre-kv-meta">—</span>';
        const ready = n.status === 'Ready';
        return '<div class="sre-kv-row">' +
          '<span class="sre-status-dot ' + (ready ? 'sre-status-pass' : 'sre-status-fail') + '"></span>' +
          '<span class="sre-kv-name" style="width:180px">' + esc(n.name) + '</span>' +
          util +
          '<span class="sre-badge ' + (ready ? 'sre-badge-success' : 'sre-badge-error') + '">' + (ready ? '就绪' : '未就绪') + '</span>' +
          '</div>';
      }).join('');
    })();

    const podsRows = (function () {
      const pods = data.unhealthy_pods || [];
      if (!pods.length) return '<div class="sre-empty">无异常 Pod（共 ' + (s.pods_total || 0) + ' 个）</div>';
      return pods.map(p => '<div class="sre-kv-row">' +
        '<span class="sre-status-dot sre-status-fail"></span>' +
        '<span class="sre-kv-name" style="flex:1">' + esc(p.namespace + '/' + p.name) + '</span>' +
        '<span class="sre-kv-meta">重启 ' + (p.restarts ?? 0) + ' · 存活 ' + esc(p.age || '?') + '</span>' +
        '<span class="sre-badge sre-badge-error">' + esc(p.status) + '</span>' +
        '</div>').join('');
    })();

    const half = '<div class="sre-grid-2">' +
      panel('节点健康', badgeHtml('success', (s.nodes_ready || 0) + '/' + (s.nodes_total || 0)), nodesRows) +
      panel('异常 Pod', badgeHtml((s.unhealthy_pods > 0) ? 'error' : 'success', String(s.unhealthy_pods || 0)), podsRows) +
      '</div>';
    parts.push(half);

    // 近期警告事件
    (function () {
      const events = data.events || [];
      if (!events.length) { parts.push(panel('近期警告事件', badgeHtml('success', '0'), empty('近期无警告事件'))); return; }
      const rows = events.map(e => {
        const when = (e.age_min != null) ? (e.age_min + ' 分钟前') : '—';
        return '<div class="sre-kv-row">' +
          '<span class="sre-status-dot sre-status-warn"></span>' +
          '<span class="sre-kv-name" style="flex:1">' + esc(e.reason) + '</span>' +
          '<span class="sre-kv-meta" style="max-width:42%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(e.object) + ' · ' + esc(e.message) + '</span>' +
          '<span class="sre-badge sre-badge-warning">' + when + '</span>' +
          '</div>';
      }).join('');
      parts.push(panel('近期警告事件', badgeHtml('warning', String(s.warning_events || 0)), rows));
    })();

    // 工作负载与容量 (degraded deployments + HPA at max + PVC high)
    (function () {
      const rows = [];
      const d = data.deployments_degraded || [];
      const h = data.hpa_at_max || [];
      const p = data.pvc_high || [];
      if (d.length) {
        rows.push(groupLabel('未就绪 Deployment'));
        d.forEach(x => rows.push('<div class="sre-kv-row">' +
          '<span class="sre-status-dot sre-status-warn"></span>' +
          '<span class="sre-kv-name" style="flex:1">' + esc(x.namespace + '/' + x.name) + '</span>' +
          '<span class="sre-kv-meta">就绪 ' + x.ready + ' / 期望 ' + x.desired + '</span>' +
          '<span class="sre-badge sre-badge-warning">未就绪</span>' +
          '</div>'));
      }
      if (h.length) {
        rows.push(groupLabel('HPA 触顶'));
        h.forEach(x => rows.push('<div class="sre-kv-row">' +
          '<span class="sre-status-dot sre-status-warn"></span>' +
          '<span class="sre-kv-name" style="flex:1">' + esc(x.namespace + '/' + x.name) + '</span>' +
          '<span class="sre-kv-meta">' + x.current + ' / ' + x.max + ' 副本</span>' +
          '<span class="sre-badge sre-badge-warning">触顶</span>' +
          '</div>'));
      }
      if (p.length) {
        const thr = (data.thresholds && data.thresholds.pvc_alert_percent) || 70;
        rows.push(groupLabel('PVC 使用率告警（≥' + thr + '%）'));
        p.forEach(v => rows.push('<div class="sre-kv-row">' +
          '<span class="sre-status-dot ' + (v.percent >= 90 ? 'sre-status-fail' : 'sre-status-warn') + '"></span>' +
          '<span class="sre-kv-name" style="width:200px">' + esc(v.key) + '</span>' +
          bar(v.percent, '') +
          '<span class="sre-badge ' + (v.percent >= 90 ? 'sre-badge-error' : 'sre-badge-warning') + '">' + v.percent + '%</span>' +
          '</div>'));
      }
      if (!rows.length) { parts.push(panel('工作负载与容量', badgeHtml('success', '健康'), empty('工作负载运行正常，容量充足'))); return; }
      parts.push(panel('工作负载与容量', badgeHtml('warning', String(d.length + h.length + p.length) + ' 项'), rows.join('')));
    })();

    // 采集错误 (only when the collection itself degraded)
    (function () {
      const errs = data.errors || [];
      if (!errs.length) return;
      parts.push(panel('采集错误', badgeHtml('warning', String(errs.length)), errs.map(e => '<div class="sre-kv-row"><span class="sre-status-dot sre-status-warn"></span><span class="sre-kv-name" style="font-weight:500">' + esc(e) + '</span></div>').join('')));
    })();

    document.getElementById('sre-sections').innerHTML = parts.join('');

    // --- footer / source badge ---
    const checked = document.getElementById('sre-checked-at');
    if (checked) checked.textContent = data.checked_at ? ('快照时间 ' + data.checked_at.replace('T', ' ').slice(0, 19) + ' UTC') : '';
    const title = document.querySelector('.sre-section-title');
    if (title) {
      title.querySelectorAll('.sre-source-badge').forEach(b => b.remove());
      const b = document.createElement('span');
      b.className = 'sre-badge sre-source-badge ' + (data.connected ? 'sre-badge-success' : data.source === 'error' ? 'sre-badge-error' : 'sre-badge-warning');
      b.style.cssText = 'margin-left:10px;font-size:11px;vertical-align:middle';
      b.textContent = data.connected ? 'LIVE 实时' : data.source === 'error' ? '接口异常' : '未连接集群';
      title.appendChild(b);
    }

    lucide.createIcons();
  }

  async function load() {
    let data;
    try { data = await (await fetch('/api/ui/health')).json(); }
    catch (e) { data = { source: 'error', connected: false, cluster_error: '无法访问 /api/ui/health：' + e, summary: {}, findings: [], nodes: [], unhealthy_pods: [], events: [], deployments_degraded: [], hpa_at_max: [], node_metrics: [], pvc_high: [], errors: [] }; }
    render(data);
  }

  const btn = document.getElementById('sre-refresh');
  if (btn) btn.addEventListener('click', load);

  load();
})();
</script>
  <script src="/ui/_sre-alerts.js"></script>
</body>
</html>
