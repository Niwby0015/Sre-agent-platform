/* SRE-Agent UI — light ops console tokens */

:root {
  /* Neutral foundation */
  --sre-background: #ffffff;
  --sre-foreground: #1f2937;
  --sre-card: #ffffff;
  --sre-card-foreground: #1f2937;
  --sre-popover: #ffffff;
  --sre-popover-foreground: #1f2937;
  --sre-muted: #f3f4f6;
  --sre-muted-foreground: #6b7280;
  --sre-border: #e5e7eb;
  --sre-input: #f9fafb;
  --sre-ring: #0891b2;

  /* Brand primary — cyan */
  --sre-primary: #0e7490;
  --sre-primary-foreground: #ffffff;
  --sre-primary-hover: #155e75;
  --sre-primary-subtle: rgba(14, 116, 144, 0.10);

  /* Semantic surfaces */
  --sre-surface: #ffffff;
  --sre-surface-2: #f3f4f6;
  --sre-surface-3: #e5e7eb;
  --sre-line: #e5e7eb;

  /* State colors */
  --sre-state-success: #16a34a;
  --sre-state-success-subtle: rgba(22, 163, 74, 0.12);
  --sre-state-warning: #d97706;
  --sre-state-warning-subtle: rgba(217, 119, 6, 0.12);
  --sre-state-error: #dc2626;
  --sre-state-error-subtle: rgba(220, 38, 38, 0.12);
  --sre-state-info: #2563eb;
  --sre-state-info-subtle: rgba(37, 99, 235, 0.12);

  /* Radius */
  --sre-radius-small: 4px;
  --sre-radius-medium: 8px;
  --sre-radius-large: 12px;

  /* Typography */
  --sre-font-sans: Inter, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --sre-font-mono: "JetBrains Mono", "Fira Code", "SF Mono", Consolas, monospace;
}

.light {
  color-scheme: light;
}

  .sre-grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-items: start; }
  .sre-conn-ok { background: var(--sre-state-success-subtle); color: var(--sre-state-success); }
  .sre-conn-warn { background: var(--sre-state-warning-subtle); color: var(--sre-state-warning); }
  .sre-conn-err { background: var(--sre-state-error-subtle); color: var(--sre-state-error); }
  @media (max-width: 900px) { .sre-grid-2 { grid-template-columns: 1fr; } }
</style>
<script>
(function () {
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const badgeHtml = (tone, text) => {
    const cls = tone === 'success' ? 'sre-badge-success' : tone === 'warning' ? 'sre-badge-warning' : tone === 'error' ? 'sre-badge-error' : 'sre-badge-info';
    return '<span class="sre-badge ' + cls + '">' + esc(text) + '</span>';
  };
  const SEV = {
    critical: ['严重', 'sre-badge-error', 'sre-status-fail'],
    warning: ['警告', 'sre-badge-warning', 'sre-status-warn'],
    info: ['信息', 'sre-badge-info', 'sre-status-pass'],
  };
  const fmtAgo = iso => {
    if (!iso) return '—';
    const t = new Date(iso).getTime();
    if (isNaN(t)) return iso;
    const s = Math.max(0, (Date.now() - t) / 1000);
    if (s < 60) return '刚刚';
    if (s < 3600) return Math.floor(s / 60) + ' 分钟前';
    if (s < 86400) return Math.floor(s / 3600) + ' 小时前';
    return Math.floor(s / 86400) + ' 天前';
  };
  const panel = (title, badge, body) =>
    '<div class="sre-panel"><div class="sre-panel-head"><span class="sre-panel-title">' + esc(title) + '</span>' + (badge || '') + '</div>' +
    '<div class="sre-panel-body">' + body + '</div></div>';
  const empty = msg => '<div class="sre-empty">' + esc(msg) + '</div>';

  function findingRow(f) {
    const sev = SEV[f.severity] || SEV.info;
    const ns = [f.namespace, f.kind, f.resource_name].filter(Boolean).join(' / ');
    const meta = [];
    if (f.reason) meta.push(esc(f.reason));
    meta.push('首现 ' + fmtAgo(f.first_seen));
    if (f.times_seen > 1) meta.push('重复 ' + f.times_seen + ' 次');
    return '<div class="sre-kv-row" style="align-items:flex-start">' +
      '<span class="sre-status-dot ' + sev[2] + '" style="margin-top:6px"></span>' +
      '<div style="flex:1;min-width:0">' +
        '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">' +
          '<span style="font-weight:600">' + esc(f.title) + '</span>' +
          '<span class="sre-badge ' + sev[1] + '">' + sev[0] + '</span>' +
          (f.acked ? '<span class="sre-badge sre-badge-info">已确认</span>' : '') +
        '</div>' +
        (ns ? '<div class="sre-kv-meta" style="margin-top:4px">' + esc(ns) + '</div>' : '') +
        (f.detail ? '<div class="sre-kv-meta" style="margin-top:6px;line-height:1.5">' + esc(f.detail) + '</div>' : '') +
        '<div class="sre-kv-meta" style="margin-top:6px">' + meta.join(' · ') + '</div>' +
      '</div>' +
    '</div>';
  }

  function resolvedRow(f) {
    return '<div class="sre-kv-row">' +
      '<span class="sre-status-dot sre-status-pass"></span>' +
      '<span style="font-weight:500;flex:1;min-width:0">' + esc(f.title) + '</span>' +
      '<span class="sre-kv-meta">' + (f.namespace ? esc(f.namespace) + ' · ' : '') + '恢复于 ' + fmtAgo(f.resolved_at) + '</span>' +
      '<span class="sre-badge sre-badge-success">已恢复</span>' +
    '</div>';
  }

  function render(data) {
    const s = data.summary || {};
    const setKpi = (id, value, delta, color) => {
      const el = document.getElementById(id);
      if (!el) return;
      el.textContent = value;
      el.style.color = color || 'var(--sre-foreground)';
      const d = document.getElementById(id + '-delta');
      if (d) d.textContent = delta || '—';
    };
    setKpi('kpi-open', (s.open != null) ? String(s.open) : '—', (s.critical > 0) ? (s.critical + ' 严重') : '无开放告警', (s.open > 0) ? 'var(--sre-state-error)' : 'var(--sre-foreground)');
    setKpi('kpi-critical', (s.critical != null) ? String(s.critical) : '—', '需立即处理', (s.critical > 0) ? 'var(--sre-state-error)' : 'var(--sre-foreground)');
    setKpi('kpi-warning', (s.warning != null) ? String(s.warning) : '—', '需关注', (s.warning > 0) ? 'var(--sre-state-warning)' : 'var(--sre-foreground)');
    setKpi('kpi-resolved', (s.resolved_recent != null) ? String(s.resolved_recent) : '—', '近 7 天', 'var(--sre-state-success)');

    const parts = [];
    const open = data.open || [];
    if (!open.length) {
      parts.push(panel('开放告警', badgeHtml('success', '0'), empty('当前无开放告警')));
    } else {
      parts.push(panel('开放告警', badgeHtml((s.critical > 0) ? 'error' : 'warning', String(open.length)), open.map(findingRow).join('')));
    }
    const resolved = data.resolved || [];
    if (resolved.length) {
      parts.push(panel('最近恢复', badgeHtml('success', String(resolved.length)), resolved.map(resolvedRow).join('')));
    }
    document.getElementById('sre-sections').innerHTML = parts.join('');

    const checked = document.getElementById('sre-checked-at');
    if (checked) {
      checked.textContent = data.last_check_at
        ? ('上次检查 ' + data.last_check_at.replace('T', ' ').slice(0, 19) + ' UTC' + (data.check_no ? ' · 第 ' + data.check_no + ' 次' : ''))
        : '尚未执行过定时检查';
    }
    const title = document.querySelector('.sre-section-title');
    if (title) {
      title.querySelectorAll('.sre-source-badge').forEach(b => b.remove());
      const b = document.createElement('span');
      b.className = 'sre-badge sre-source-badge ' + (data.source === 'live' ? 'sre-badge-success' : 'sre-badge-info');
      b.style.cssText = 'margin-left:10px;font-size:11px;vertical-align:middle';
      b.textContent = data.source === 'live' ? 'LIVE 实时' : '内存态';
      title.appendChild(b);
    }
    lucide.createIcons();
  }

  async function load() {
    let data;
    try { data = await (await fetch('/api/ui/alerts')).json(); }
    catch (e) { data = { source: 'error', summary: {}, open: [], resolved: [], last_check_at: null, check_no: null }; }
    render(data);
  }

  const btn = document.getElementById('sre-refresh');
  if (btn) btn.addEventListener('click', load);
  load();
})();
</script>
</body>
</html>
