<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preflight</title>
    <style id="theme-vars">
/* SRE-Agent UI — dark ops console tokens */

:root {
  /* Neutral foundation */
  --sre-background: #0b0b0f;
  --sre-foreground: #e8e8ef;
  --sre-card: #14141a;
  --sre-card-foreground: #e8e8ef;
  --sre-popover: #14141a;
  --sre-popover-foreground: #e8e8ef;
  --sre-muted: #1e1e24;
  --sre-muted-foreground: #9ca3af;
  --sre-border: rgba(255, 255, 255, 0.08);
  --sre-input: rgba(255, 255, 255, 0.06);
  --sre-ring: #22d3ee;

  /* Brand primary — cyan */
  --sre-primary: #22d3ee;
  --sre-primary-foreground: #061519;
  --sre-primary-hover: #67e8f9;
  --sre-primary-subtle: rgba(34, 211, 238, 0.12);

  /* Semantic surfaces */
  --sre-surface: #14141a;
  --sre-surface-2: #1e1e24;
  --sre-surface-3: #272730;
  --sre-line: rgba(255, 255, 255, 0.08);

  /* State colors */
  --sre-state-success: #22c55e;
  --sre-state-success-subtle: rgba(34, 197, 94, 0.12);
  --sre-state-warning: #f59e0b;
  --sre-state-warning-subtle: rgba(245, 158, 11, 0.12);
  --sre-state-error: #ef4444;
  --sre-state-error-subtle: rgba(239, 68, 68, 0.12);
  --sre-state-info: #3b82f6;
  --sre-state-info-subtle: rgba(59, 130, 246, 0.12);

  /* Radius */
  --sre-radius-small: 4px;
  --sre-radius-medium: 8px;
  --sre-radius-large: 12px;

  /* Typography */
  --sre-font-sans: Inter, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --sre-font-mono: "JetBrains Mono", "Fira Code", "SF Mono", Consolas, monospace;
}

.dark {
  color-scheme: dark;
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--sre-background);
    --color-foreground: var(--sre-foreground);
    --color-card: var(--sre-card);
    --color-card-foreground: var(--sre-card-foreground);
    --color-popover: var(--sre-popover);
    --color-popover-foreground: var(--sre-popover-foreground);
    --color-primary: var(--sre-primary);
    --color-primary-foreground: var(--sre-primary-foreground);
    --color-muted: var(--sre-muted);
    --color-muted-foreground: var(--sre-muted-foreground);
    --color-border: var(--sre-border);
    --color-input: var(--sre-input);
    --color-ring: var(--sre-ring);
    --radius-sm: var(--sre-radius-small);
    --radius-md: var(--sre-radius-medium);
    --radius-lg: var(--sre-radius-large);
  }
  @layer base {
    body { background: var(--sre-background); color: var(--sre-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>

    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;

        -webkit-mask-size: contain;

        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;

        background-color: currentColor;
